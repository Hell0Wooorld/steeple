name: 순공 Android APK

on:
  push:
    paths:
      - 'sungong/**'
      - '.github/workflows/sungong-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sungong/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sungong/firebase/package-lock.json
      - run: npm ci
      - run: npm test

  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sungong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sungong-apk
          path: sungong/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
